<div class="container">

    <img src="logo.jpg" >
    <h1>Grade Calculator</h1>
    <form [formGroup]="gradeForm" (ngSubmit)="onSubmit()">
      <div class="subject-card" *ngFor="let subject of subjects">
        <h3>{{ subject.name }} (Coefficient: {{ subject.coefficient }})</h3>
        <div formGroupName="{{ subject.name }}">
          <div class="input-group">
            <label>CC Grade:</label>
            <input type="number" step="0.01" formControlName="cc" min="0" max="20">
            <div class="error" *ngIf="gradeForm.get(subject.name)?.get('cc')?.invalid">
              Valid grade required (0-20)
            </div>
          </div>
          <div class="input-group">
            <label>Exam Grade:</label>
            <input type="number" step="0.01" formControlName="exam" min="0" max="20">
            <div class="error" *ngIf="gradeForm.get(subject.name)?.get('exam')?.invalid">
              Valid grade required (0-20)
            </div>
          </div>
        </div>
      </div>
      <button type="submit" [disabled]="!gradeForm.valid">Calculate Average</button>
    </form>
  </div>
